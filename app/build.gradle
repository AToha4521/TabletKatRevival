plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace 'org.exalm.tabletkat'

    defaultConfig {
        applicationId "org.exalm.tabletkat"
        minSdk 19
        targetSdk 19
        versionCode 20
        versionName "2.0-revival"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            // NEVER enable minify for Xposed modules — class names must stay intact
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        disable 'OldTargetApi', 'GradleCompatible', 'InvalidPackage'
    }

    packagingOptions {
        exclude 'META-INF/xposed/**'
    }
}

dependencies {
    // Xposed Bridge API — compileOnly, NOT bundled in APK (provided at runtime by framework)
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
}
